    example_password: 'zkWZTH$$BmfTAOW4'
    auto_generated_credentials: true
characteristics:
  - Flagged isTestPatient=true; organization-scoped
  - Full CRUD, consent management, and project assignment
  - Document upload up to 100 MB
  - MCP tool access without the standard patient OAuth workflow
  - Do not affect real patient data
notes: >-
  Credentials above are the documentation's illustrative examples, not shared
  live secrets. Authentication endpoints and API workflows are identical between

aid: healthex
name: HealthEx
description: >-
  HealthEx is a patient-centric health-data-rights platform that securely unifies an
  individual's medical records across places of care into one connected history, and lets
  them share that record — under explicit, patient-initiated consent — with providers, apps,
  and AI services. It operates as an Information Access Services (IAS) Provider on the TEFCA
  network, complies with HIPAA privacy rules, and reaches records across more than 80% of U.S.
  care providers. For developers HealthEx exposes a REST admin API (patient outreach, consent
  checking and auditing, record-location search, usage), a FHIR R4 server ($everything,
  USCDIv3), and a hosted Model Context Protocol server that gives AI agents governed,
  consent-scoped access to a patient's health record.
